<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Effect</title>
    <style>
        body{
               background-color: #333;
               display: flex;
               align-items: center;
               justify-content: center;
               margin-top: 100px;

               
               
        }

        .button{
                  color: white;
                  font-size:2rem;
                  box-shadow: 0px 0px 20px aqua;
                  border-radius: 12px;
                  padding:10px 20px;
                  width: 10%;
                  text-align: center;
                  
        }

        .button:hover{
                         box-shadow: 0px 20px 50px rgb(237, 47, 79);
        }
    </style>
</head>
<body>
          <div class="button">
               Call Now
          </div>
</body>
</html>
